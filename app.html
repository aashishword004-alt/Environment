
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>EcoBot – Environment Chatbot</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --eco-dark: #1b4332;
            --eco-main: #2d6a4f;
            --eco-light: #95d5b2;
            --eco-pale: #d8f3dc;
            --eco-bg: #f1f8f3;
            --eco-sky: #48cae4;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #d8f3dc 0%, #e0f7fa 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .app-wrap {
            max-width: 1100px;
        }

        .chat-card {
            border: 0;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(27, 67, 50, .18);
            height: 86vh;
            min-height: 560px;
        }

        /* Header */

        .chat-header {
            background: linear-gradient(135deg, var(--eco-dark), var(--eco-main));
            color: #fff;
        }

        .bot-avatar {
            width: 48px;
            height: 48px;
            background: var(--eco-pale);
            color: var(--eco-main);
            font-size: 1.5rem;
            position: relative;
        }

        .bot-avatar .status-dot {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 12px;
            height: 12px;
            background: #52b788;
            border: 2px solid var(--eco-dark);
            border-radius: 50%;
        }

        /* Messages area */

        .chat-body {
            background:
                radial-gradient(circle at 10% 10%, rgba(149,213,178,.25), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(72,202,228,.15), transparent 40%),
                var(--eco-bg);

            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 80%;
            animation: pop .25s ease;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .bubble {
            padding: .7rem 1rem;
            border-radius: 1.2rem;
            line-height: 1.45;
            font-size: .95rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .msg-bot .bubble {
            background: #fff;
            color: #1f2d27;
            border-bottom-left-radius: .3rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .msg-user .bubble {
            background: var(--eco-main);
            color: #fff;
            border-bottom-right-radius: .3rem;
        }

        .mini-avatar {
            width: 32px;
            height: 32px;
            flex: none;
            background: var(--eco-pale);
            color: var(--eco-main);
        }

        .time {
            font-size: .7rem;
            color: #7a8c83;
            margin-top: .2rem;
        }

        /* Typing indicator */

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin: 0 2px;
            background: var(--eco-light);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }

        /* Quick chips */

        .chip {
            border: 1px solid var(--eco-light);
            background: #fff;
            color: var(--eco-main);
            border-radius: 2rem;
            padding: .35rem .9rem;
            font-size: .85rem;
            white-space: nowrap;
            transition: all .15s;
        }

        .chip:hover {
            background: var(--eco-main);
            color: #fff;
            border-color: var(--eco-main);
        }

        .chips-row {
            overflow-x: auto;
            scrollbar-width: none;
        }

        .chips-row::-webkit-scrollbar {
            display: none;
        }

        /* Input */

        .chat-footer {
            background: #fff;
            border-top: 1px solid #e3efe7;
        }

        .chat-input {
            border-radius: 2rem;
            border: 1px solid #cfe5d7;
            padding: .65rem 1.2rem;
        }

        .chat-input:focus {
            border-color: var(--eco-main);
            box-shadow: 0 0 0 .2rem rgba(45,106,79,.15);
        }

        .btn-send {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--eco-main);
            color: #fff;
            border: 0;
        }

        .btn-send:hover {
            background: var(--eco-dark);
            color: #fff;
        }

        .btn-send:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* Side panel */

        .side-card {
            border: 0;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(27,67,50,.12);
        }

        .fact-icon {
            width: 40px;
            height: 40px;
            border-radius: .8rem;
            background: var(--eco-pale);
            color: var(--eco-main);
            font-size: 1.2rem;
            flex: none;
        }

        @media(max-width: 576px) {
            .chat-card {
                height: 90vh;
                min-height: 500px;
            }

            .msg {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container app-wrap py-3 py-md-4">

        <div class="row g-4">

            <!-- Chat -->
            <div class="col-lg-8">

                <div class="card chat-card d-flex flex-column">

                    <!-- Header -->
                    <div class="chat-header p-3 d-flex align-items-center gap-3">

                        <div class="bot-avatar rounded-circle d-flex align-items-center justify-content-center">
                            <i class="bi bi-tree-fill"></i>
                            <span class="status-dot"></span>
                        </div>

                        <div class="flex-grow-1">
                            <h5 class="mb-0 fw-semibold">EcoBot</h5>
                            <small class="opacity-75">
                                Your friendly environment assistant · Online
                            </small>
                        </div>

                        <button class="btn btn-sm btn-outline-light rounded-pill"
                            id="clearBtn"
                            title="Clear chat">

                            <i class="bi bi-arrow-clockwise"></i>

                        </button>

                    </div>

                    <!-- Messages -->
                    <div id="chatBody"
                        class="chat-body flex-grow-1 p-3 p-md-4 d-flex flex-column gap-3">

                    </div>

                    <!-- Footer -->
                    <div class="chat-footer p-3">

                        <!-- Quick questions -->
                        <div class="chips-row d-flex gap-2 mb-3" id="chips">

                            <button type="button" class="chip">
                                <i class="bi bi-thermometer-sun me-1"></i>
                                Climate change
                            </button>

                            <button type="button" class="chip">
                                <i class="bi bi-recycle me-1"></i>
                                Recycling tips
                            </button>

                            <button type="button" class="chip">
                                <i class="bi bi-droplet-half me-1"></i>
                                Save water
                            </button>

                            <button type="button" class="chip">
                                <i class="bi bi-lightning-charge me-1"></i>
                                Renewable energy
                            </button>

                            <button type="button" class="chip">
                                <i class="bi bi-bag-x me-1"></i>
                                Reduce plastic
                            </button>

                        </div>

                        <!-- Input -->
                        <form id="chatForm" class="d-flex gap-2 align-items-center">

                            <input
                                type="text"
                                id="userInput"
                                class="form-control chat-input"
                                placeholder="Ask me anything about the environment..."
                                autocomplete="off"
                                required
                            >

                            <button
                                type="submit"
                                class="btn-send d-flex align-items-center justify-content-center"
                                id="sendBtn"
                                aria-label="Send">

                                <i class="bi bi-send-fill"></i>

                            </button>

                        </form>

                    </div>

                </div>

            </div>

            <!-- Side panel -->
            <div class="col-lg-4 d-none d-lg-block">

                <div class="card side-card mb-4">

                    <div class="card-body p-4">

                        <h6 class="fw-bold text-success mb-3">
                            <i class="bi bi-lightbulb-fill me-2"></i>
                            Did you know?
                        </h6>

                        <div class="d-flex gap-3 mb-3">

                            <div class="fact-icon d-flex align-items-center justify-content-center">
                                <i class="bi bi-tree"></i>
                            </div>

                            <small class="text-secondary">
                                A single mature tree can absorb around 22 kg of CO₂ every year.
                            </small>

                        </div>

                        <div class="d-flex gap-3 mb-3">

                            <div class="fact-icon d-flex align-items-center justify-content-center">
                                <i class="bi bi-water"></i>
                            </div>

                            <small class="text-secondary">
                                Only about 3% of Earth's water is fresh, so every drop counts.
                            </small>

                        </div>

                        <div class="d-flex gap-3">

                            <div class="fact-icon d-flex align-items-center justify-content-center">
                                <i class="bi bi-recycle"></i>
                            </div>

                            <small class="text-secondary">
                                Recycling aluminium saves energy compared with producing it from raw materials.
                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        // HTML elements
        const chatBody = document.getElementById('chatBody');

        const form = document.getElementById('chatForm');

        const input = document.getElementById('userInput');

        const sendBtn = document.getElementById('sendBtn');


        // Node.js API URL
        const API_URL = "http://localhost:5000/chat/env";


        // Current time
        function timeNow() {

            return new Date().toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });

        }


        // Add message
        function addMessage(text, who) {

            const isBot = who === 'bot';

            const row = document.createElement('div');

            row.className = `d-flex gap-2 ${
                isBot
                    ? 'msg-bot'
                    : 'msg-user justify-content-end'
            }`;

            row.innerHTML = `

                ${isBot ? `

                    <div class="mini-avatar rounded-circle d-flex align-items-center justify-content-center">

                        <i class="bi bi-tree-fill"></i>

                    </div>

                ` : ''}

                <div class="msg">

                    <div class="bubble"></div>

                    <div class="time ${isBot ? '' : 'text-end'}">

                        ${timeNow()}

                    </div>

                </div>

            `;

            // Display text safely
            row.querySelector('.bubble').textContent = text;

            chatBody.appendChild(row);

            chatBody.scrollTop = chatBody.scrollHeight;

        }


        // Typing animation
        function showTyping() {

            const row = document.createElement('div');

            row.id = 'typingRow';

            row.className = 'd-flex gap-2 msg-bot';

            row.innerHTML = `

                <div class="mini-avatar rounded-circle d-flex align-items-center justify-content-center">

                    <i class="bi bi-tree-fill"></i>

                </div>

                <div class="msg">

                    <div class="bubble typing">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            `;

            chatBody.appendChild(row);

            chatBody.scrollTop = chatBody.scrollHeight;

        }


        // Remove typing animation
        function removeTyping() {

            document.getElementById('typingRow')?.remove();

        }


        // Send question to Node.js API
        async function send(text) {

            text = text.trim();

            if (!text) return;

            // Disable send button while API is processing
            sendBtn.disabled = true;

            // Display user question
            addMessage(text, 'user');

            // Show typing animation
            showTyping();

            try {

                const response = await fetch(API_URL, {

                    method: 'POST',

                    headers: {

                        'Content-Type': 'application/json'

                    },

                    body: JSON.stringify({

                        qun: text

                    })

                });


                // Check HTTP status
                if (!response.ok) {

                    throw new Error(`HTTP Error: ${response.status}`);

                }


                // Get API response
                const data = await response.json();


                // Remove typing animation
                removeTyping();


                // Check your Node.js response format
                if (!Array.isArray(data)) {

                    throw new Error("Invalid API response format");

                }


                if (data[0]?.error !== "no") {

                    addMessage(
                        data[0]?.error || "Something went wrong.",
                        'bot'
                    );

                    return;

                }


                if (data[1]?.success !== "yes") {

                    addMessage(
                        "Unable to generate a response. Please try again.",
                        'bot'
                    );

                    return;

                }


                if (!data[2]?.message) {

                    addMessage(
                        "No response received from Gemini.",
                        'bot'
                    );

                    return;

                }


                // Display Gemini answer
                addMessage(data[2].message, 'bot');


            } catch (error) {

                removeTyping();

                console.error("API Error:", error);

                addMessage(
                    "Sorry! Something went wrong. Please check your server connection and try again.",
                    'bot'
                );

            } finally {

                sendBtn.disabled = false;

                input.focus();

            }

        }


        // Form submit
        form.addEventListener('submit', function(e) {

            e.preventDefault();

            const question = input.value;

            if (!question.trim()) return;

            input.value = '';

            send(question);

        });


        // Quick question buttons
        document.querySelectorAll('.chip').forEach(btn => {

            btn.addEventListener('click', function() {

                send(this.textContent.trim());

            });

        });


        // Welcome message
        function welcome() {

            chatBody.innerHTML = '';

            addMessage(

                "Hi, I'm EcoBot 🌿 I can help you learn about climate, recycling, water, energy and sustainable living. What would you like to know?",

                'bot'

            );

        }


        // Clear chat
        document.getElementById('clearBtn').addEventListener('click', function() {

            welcome();

        });


        // Initial message
        welcome();

    </script>

</body>

</html>
